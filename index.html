<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Dashboard</title>
    <!-- Tailwind CSS CDN for quick and clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-lg shadow-md text-center">
            <h1 class="text-3xl font-bold text-blue-600">🛍️ E-Commerce Management System</h1>
            <p class="text-gray-500 mt-1">Manage Students, Products, and Orders easily</p>
        </header>

        <!-- Grid Layout for Forms & Lists -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 1. STUDENTS SECTION -->
            <div class="bg-white p-5 rounded-lg shadow-md space-y-4">
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">👤 Add Student</h2>
                <form id="studentForm" class="space-y-3">
                    <input type="number" id="s_id" placeholder="ID (e.g. 1)" required class="w-full p-2 border rounded">
                    <input type="text" id="s_name" placeholder="Name" required class="w-full p-2 border rounded">
                    <input type="email" id="s_email" placeholder="Email" required class="w-full p-2 border rounded">
                    <input type="text" id="s_phone" placeholder="Phone" required class="w-full p-2 border rounded">
                    <input type="text" id="s_city" placeholder="City" required class="w-full p-2 border rounded">
                    <input type="text" id="s_state" placeholder="State" required class="w-full p-2 border rounded">
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add Student</button>
                </form>
                <div>
                    <h3 class="font-medium text-gray-600 mt-4 mb-2">Registered Students:</h3>
                    <ul id="studentList" class="text-sm space-y-1 bg-gray-50 p-2 rounded h-32 overflow-y-auto border"></ul>
                </div>
            </div>

            <!-- 2. PRODUCTS SECTION -->
            <div class="bg-white p-5 rounded-lg shadow-md space-y-4">
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">📦 Add Product</h2>
                <form id="productForm" class="space-y-3">
                    <input type="number" id="p_id" placeholder="ID (e.g. 101)" required class="w-full p-2 border rounded">
                    <input type="text" id="p_title" placeholder="Title (3-16 chars)" required class="w-full p-2 border rounded">
                    <input type="text" id="p_category" placeholder="Category" required class="w-full p-2 border rounded">
                    <input type="number" step="any" id="p_price" placeholder="Price" required class="w-full p-2 border rounded">
                    <input type="number" id="p_stock" placeholder="Stock Quantity" required class="w-full p-2 border rounded">
                    <input type="text" id="p_brand" placeholder="Brand" class="w-full p-2 border rounded">
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Add Product</button>
                </form>
                <div>
                    <h3 class="font-medium text-gray-600 mt-4 mb-2">Available Products:</h3>
                    <ul id="productList" class="text-sm space-y-1 bg-gray-50 p-2 rounded h-32 overflow-y-auto border"></ul>
                </div>
            </div>

            <!-- 3. ORDERS SECTION -->
            <div class="bg-white p-5 rounded-lg shadow-md space-y-4">
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2">🛒 Place Order</h2>
                <form id="orderForm" class="space-y-3">
                    <input type="number" id="o_id" placeholder="Order ID (e.g. 1001)" required class="w-full p-2 border rounded">
                    <input type="number" id="o_user_id" placeholder="Student User ID" required class="w-full p-2 border rounded">
                    <input type="number" id="o_product_id" placeholder="Product ID" required class="w-full p-2 border rounded">
                    <input type="number" id="o_quantity" placeholder="Quantity" required class="w-full p-2 border rounded">
                    <input type="text" id="o_payment" placeholder="Payment Mode (e.g. UPI)" required class="w-full p-2 border rounded">
                    <button type="submit" class="w-full bg-purple-600 text-white p-2 rounded hover:bg-purple-700">Place Order</button>
                </form>
            </div>

        </div>

        <!-- ORDERS LIST SECTION -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">📋 All Orders</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-2 border">Order ID</th>
                            <th class="p-2 border">User ID</th>
                            <th class="p-2 border">Product ID</th>
                            <th class="p-2 border">Qty</th>
                            <th class="p-2 border">Payment</th>
                            <th class="p-2 border">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="text-sm text-gray-700">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Fetch and display data on page load
        window.onload = function() {
            loadStudents();
            loadProducts();
            loadOrders();
        };

        // 1. Load Students
        async function loadStudents() {
            try {
                const res = await fetch(`${API_URL}/all_students`);
                const result = await res.json();
                const list = document.getElementById("studentList");
                list.innerHTML = "";
                if(result.data) {
                    result.data.forEach(s => {
                        list.innerHTML += `<li class="border-b py-1">ID: ${s.id} - <b>${s.name}</b> (${s.city})</li>`;
                    });
                }
            } catch (err) { console.error("Error loading students:", err); }
        }

        // 2. Load Products
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/all_products`);
                const result = await res.json();
                const list = document.getElementById("productList");
                list.innerHTML = "";
                if(result.data) {
                    result.data.forEach(p => {
                        list.innerHTML += `<li class="border-b py-1">ID: ${p.id} - <b>${p.title}</b> (₹${p.price}) [Stock: ${p.stock}]</li>`;
                    });
                }
            } catch (err) { console.error("Error loading products:", err); }
        }

        // 3. Load Orders
        async function loadOrders() {
            try {
                const res = await fetch(`${API_URL}/all_orders`);
                const result = await res.json();
                const tbody = document.getElementById("orderTableBody");
                tbody.innerHTML = "";
                if(result.data) {
                    result.data.forEach(o => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="p-2 border">${o.id}</td>
                                <td class="p-2 border">${o.user_id}</td>
                                <td class="p-2 border">${o.product_id}</td>
                                <td class="p-2 border">${o.quantity}</td>
                                <td class="p-2 border">${o.payment_mode}</td>
                                <td class="p-2 border">${o.status ? 'Active' : 'Inactive'}</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) { console.error("Error loading orders:", err); }
        }

        // Handle Student Form Submission
        document.getElementById("studentForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                id: parseInt(document.getElementById("s_id").value),
                name: document.getElementById("s_name").value,
                email: document.getElementById("s_email").value,
                phone: document.getElementById("s_phone").value,
                city: document.getElementById("s_city").value,
                state: document.getElementById("s_state").value,
                password: "Password@123"
            };

            const res = await fetch(`${API_URL}/create_student`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            loadStudents();
            document.getElementById("studentForm").reset();
        });

        // Handle Product Form Submission
        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                id: parseInt(document.getElementById("p_id").value),
                title: document.getElementById("p_title").value,
                category: document.getElementById("p_category").value,
                price: parseFloat(document.getElementById("p_price").value),
                stock: parseInt(document.getElementById("p_stock").value),
                brand: document.getElementById("p_brand").value
            };

            const res = await fetch(`${API_URL}/create_product`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            loadProducts();
            document.getElementById("productForm").reset();
        });

        // Handle Order Form Submission
        document.getElementById("orderForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                id: parseInt(document.getElementById("o_id").value),
                user_id: parseInt(document.getElementById("o_user_id").value),
                product_id: parseInt(document.getElementById("o_product_id").value),
                quantity: parseInt(document.getElementById("o_quantity").value),
                payment_mode: document.getElementById("o_payment").value,
                status: true
            };

            const res = await fetch(`${API_URL}/create_order`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            loadOrders();
            loadProducts(); // Stock updates automatically
            document.getElementById("orderForm").reset();
        });
    </script>
</body>
</html>
